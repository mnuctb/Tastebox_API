<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteBox | Recetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/pages/recipes.js"></script>
</head>
<body>
    <main class="container">
        <div class="page-title">
            <p class="eyebrow">Catálogo</p>
            <h1>Recetas</h1>
            <p class="muted">Encuentra tu próxima preparación por nombre, tipo de cocina, dificultad o tiempo.</p>
        </div>
        <form class="filters" id="filter-form">
            <input id="search" name="search" type="search" placeholder="¿Qué quieres cocinar?">
            <div class="filter-grid">
                <div class="form-field">
                    <label for="cuisine-type">Tipo de cocina</label>
                    <select id="cuisine-type" name="cuisineTypeId">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="difficulty">Dificultad</label>
                    <select id="difficulty" name="difficulty">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="access">Acceso</label>
                    <select id="access" name="access">
                        <option value="">Todos</option>
                        <option value="free">Gratuito</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="max-prep-time">Tiempo máximo: <span id="max-prep-time-label">Sin límite</span></label>
                    <input id="max-prep-time" name="maxPrepTime" type="range" min="10" max="60" step="5" value="60">
                </div>
            </div>
            <p class="field-hint" id="result-count"></p>
        </form>
        <div id="recipe-results"></div>
    </main>
</body>
</html>
