<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteBox | Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/pages/login.js"></script>
</head>
<body>
    <main class="split-page">
        <div class="split-image" style="background-image: url('img/login.jpg')"></div>
        <div class="split-form">
            <form id="login-form" novalidate>
                <h1>¡Bienvenido de nuevo!</h1>
                <div id="login-error" class="form-error"></div>
                <div class="form-field">
                    <label for="email">Correo electrónico</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="center">
                    <button class="button" type="submit">Iniciar sesión</button>
                </div>
                <p class="form-footer">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
            </form>
        </div>
    </main>
</body>
</html>
