<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteBox | Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/pages/admin-users.js"></script>
</head>
<body>
    <main class="container">
        <div class="section-header page-title">
            <div>
                <h1 class="admin-title">Usuarios registrados</h1>
                <p class="muted">Consulta y administra las cuentas de la plataforma.</p>
            </div>
            <div class="form-field admin-filter">
                <label for="user-status">Estado</label>
                <select id="user-status">
                    <option value="">Todos</option>
                    <option value="active">Activos</option>
                    <option value="suspended">Suspendidos</option>
                </select>
            </div>
        </div>
        <p class="field-hint" id="user-count"></p>
        <div class="admin-table" id="user-table"></div>
    </main>
</body>
</html>
