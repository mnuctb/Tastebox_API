<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteBox | Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/pages/register.js"></script>
</head>
<body>
    <main class="split-page">
        <div class="split-image" style="background-image: url('img/register.jpg')"></div>
        <div class="split-form">
            <form id="register-form" novalidate>
                <h1>Crea tu cuenta</h1>
                <div id="register-error" class="form-error"></div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="first-name">Nombre</label>
                        <input id="first-name" name="firstName" autocomplete="given-name" required>
                    </div>
                    <div class="form-field">
                        <label for="last-name">Apellido</label>
                        <input id="last-name" name="lastName" autocomplete="family-name" required>
                    </div>
                </div>
                <div class="form-field">
                    <label for="email">Correo electrónico</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                    <span class="field-hint">Mínimo 8 caracteres, con una mayúscula y un número.</span>
                </div>
                <div class="form-field">
                    <label for="password-confirmation">Confirmar contraseña</label>
                    <input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>
                </div>
                <label class="checkbox-row">
                    <input id="terms" name="terms" type="checkbox">
                    Acepto los términos de uso y el tratamiento de mis datos.
                </label>
                <div class="center">
                    <button class="button" type="submit">Crear cuenta</button>
                </div>
                <p class="form-footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </form>
        </div>
    </main>
</body>
</html>
